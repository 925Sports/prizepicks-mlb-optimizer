name: Update MLB PrizePicks Data

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch: # Manual trigger button

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly grant write permission

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest CSVs from Google Sheets
        run: |
          mkdir -p data

          # Existing PrizePicks data (gid=0)
          curl -L -o data/prizepicks-mlb.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLw3UZqoWqheDXCENlKhAGk8adRqvYH8LFik2LFAhKV4785KLw3a4e6jACDYPoKzqfquYDn5Tg1pB0/pub?gid=0&single=true&output=csv"

          # New Underdog + CD data (gid=1678510326, sheet name UD+CD)
          curl -L -o data/underdog-mlb.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLw3UZqoWqheDXCENlKhAGk8adRqvYH8LFik2LFAhKV4785KLw3a4e6jACDYPoKzqfquYDn5Tg1pB0/pub?gid=1678510326&single=true&output=csv"

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update MLB PrizePicks + Underdog data"
          file_pattern: data/*.csv
          branch: main
